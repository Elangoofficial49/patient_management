<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration - CarePulse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4 p-sm-5">
                        <div class="text-center mb-4">
                            <a href="/index.html" class="text-decoration-none">
                                <h3 class="fw-bold text-primary"><i class="bi bi-hospital me-2"></i>CarePulse</h3>
                            </a>
                            <p class="text-muted">Create your Patient Account</p>
                        </div>

                        <form onsubmit="handleRegister(event)">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Username *</label>
                                    <input type="text" id="regUsername" class="form-control" required placeholder="Choose a username">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Email Address *</label>
                                    <input type="email" id="regEmail" class="form-control" required placeholder="name@example.com">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Password *</label>
                                    <input type="password" id="regPassword" class="form-control" required placeholder="At least 6 characters">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Full Name *</label>
                                    <input type="text" id="regFullName" class="form-control" required placeholder="John Doe">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Phone Number *</label>
                                    <input type="tel" id="regPhone" class="form-control" required placeholder="+1-555-0199">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Date of Birth</label>
                                    <input type="date" id="regDob" class="form-control">
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Gender</label>
                                    <select id="regGender" class="form-select">
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Blood Group</label>
                                    <select id="regBloodGroup" class="form-select">
                                        <option value="A+">A+</option>
                                        <option value="A-">A-</option>
                                        <option value="B+">B+</option>
                                        <option value="B-">B-</option>
                                        <option value="O+">O+</option>
                                        <option value="O-">O-</option>
                                        <option value="AB+">AB+</option>
                                        <option value="AB-">AB-</option>
                                    </select>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Emergency Contact</label>
                                    <input type="text" id="regEmergencyContact" class="form-control" placeholder="Phone number">
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-semibold">Residential Address</label>
                                    <textarea id="regAddress" class="form-control" rows="2" placeholder="Full residential address"></textarea>
                                </div>
                            </div>

                            <button type="submit" id="btnRegister" class="btn btn-primary w-100 py-2 mt-4 fw-bold">Register Account</button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="mb-0 text-muted">Already have an account? <a href="/login.html" class="text-primary fw-bold text-decoration-none">Sign In</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
