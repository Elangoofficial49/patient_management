<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration | CarePulse Hospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

    <div class="container py-5 min-vh-100 d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center">
            <div class="col-md-10 col-lg-8">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-dark text-white p-4 text-center border-0">
                        <a href="/index.html" class="text-white text-decoration-none">
                            <h3 class="fw-bold mb-1"><i class="bi bi-heart-pulse-fill text-primary me-2"></i>CarePulse</h3>
                        </a>
                        <small class="text-light">Create Your Digital Patient Profile</small>
                    </div>
                    <div class="card-body p-4 p-md-5 bg-white">
                        <h4 class="fw-bold mb-3">Register as Patient</h4>
                        <p class="text-muted small mb-4">Fill out your information to schedule appointments and access online medical records.</p>
                        
                        <form onsubmit="handleRegister(event)">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Username *</label>
                                    <input type="text" id="regUsername" class="form-control" required placeholder="Choose username">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Email Address *</label>
                                    <input type="email" id="regEmail" class="form-control" required placeholder="your.email@example.com">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Password *</label>
                                    <input type="password" id="regPassword" class="form-control" required placeholder="Min 6 characters">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Full Name *</label>
                                    <input type="text" id="regFullName" class="form-control" required placeholder="e.g. John Doe">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Phone Number *</label>
                                    <input type="tel" id="regPhone" class="form-control" required placeholder="+1-555-0100">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Date of Birth</label>
                                    <input type="date" id="regDob" class="form-control">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Gender</label>
                                    <select id="regGender" class="form-select">
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Blood Group</label>
                                    <select id="regBloodGroup" class="form-select">
                                        <option value="O+">O+</option>
                                        <option value="O-">O-</option>
                                        <option value="A+">A+</option>
                                        <option value="A-">A-</option>
                                        <option value="B+">B+</option>
                                        <option value="B-">B-</option>
                                        <option value="AB+">AB+</option>
                                        <option value="AB-">AB-</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Emergency Contact</label>
                                    <input type="text" id="regEmergencyContact" class="form-control" placeholder="+1-555-0999">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Address</label>
                                    <textarea id="regAddress" class="form-control" rows="2" placeholder="Residential address"></textarea>
                                </div>
                            </div>

                            <button type="submit" id="btnRegister" class="btn btn-primary btn-lg w-100 py-3 fw-bold mt-4">
                                <i class="bi bi-person-plus me-2"></i> Complete Patient Registration
                            </button>
                        </form>
                    </div>
                    <div class="card-footer bg-light p-3 text-center border-0">
                        <span class="text-muted">Already have an account?</span>
                        <a href="/login.html" class="fw-bold text-primary ms-1">Login Here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
