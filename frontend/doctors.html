<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors - CarePulse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/index.html">
                <i class="bi bi-hospital text-primary me-2 fs-3"></i> CarePulse
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="/departments.html">Departments</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/doctors.html">Doctors</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contact.html">Contact</a></li>
                </ul>
                <a href="/login.html" class="btn btn-outline-primary me-2">Login</a>
                <a href="/register.html" class="btn btn-primary">Register</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="text-center mb-5">
            <h2 class="fw-bold text-primary">Our Specialist Doctors</h2>
            <p class="text-muted">Find expert medical specialists and book online consultation.</p>
        </div>

        <div class="row g-4" id="publicDoctorsContainer">
            <!-- Loaded dynamically via API -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await apiFetch('/patients/doctors');
                const container = document.getElementById('publicDoctorsContainer');
                container.innerHTML = res.data.map(d => `
                    <div class="col-md-4">
                        <div class="card h-100 border-0 shadow-sm p-4">
                            <div class="stat-icon bg-light-primary mb-3"><i class="bi bi-person-badge"></i></div>
                            <h4 class="fw-bold">${d.fullName}</h4>
                            <span class="badge bg-info text-dark w-auto mb-2">${d.specialization}</span>
                            <p class="text-muted mb-1"><strong>Qualification:</strong> ${d.qualification || 'N/A'}</p>
                            <p class="text-muted mb-1"><strong>Experience:</strong> ${d.experience} Years</p>
                            <p class="text-muted mb-3"><strong>Consultation Fee:</strong> $${d.consultationFee}</p>
                            <a href="/register.html" class="btn btn-primary w-100"><i class="bi bi-calendar-plus me-1"></i> Book Appointment</a>
                        </div>
                    </div>
                `).join('');
            } catch(e) {}
        });
    </script>
</body>
</html>
