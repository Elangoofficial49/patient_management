<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CarePulse Hospital Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

    <div class="container py-5 min-vh-100 d-flex align-items-center justify-content-center">
        <div class="row w-100 justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-dark text-white p-4 text-center border-0">
                        <a href="/index.html" class="text-white text-decoration-none">
                            <h3 class="fw-bold mb-1"><i class="bi bi-heart-pulse-fill text-primary me-2"></i>CarePulse</h3>
                        </a>
                        <small class="text-light">Hospital Management & Patient Portal</small>
                    </div>
                    <div class="card-body p-4 p-md-5 bg-white">
                        <h4 class="fw-bold mb-3 text-center">Sign In to Your Account</h4>
                        <p class="text-muted text-center small mb-4">Access your appointments, prescriptions, and medical records.</p>
                        
                        <form onsubmit="handleLogin(event)">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Username or Email *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                    <input type="text" id="loginUsername" class="form-control form-control-lg" required placeholder="Enter username">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Password *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                    <input type="password" id="loginPassword" class="form-control form-control-lg" required placeholder="Enter password">
                                </div>
                            </div>

                            <button type="submit" id="btnLogin" class="btn btn-primary btn-lg w-100 py-3 fw-bold mb-3">
                                <i class="bi bi-box-arrow-in-right me-2"></i> Login to Portal
                            </button>
                        </form>

                        <div class="alert alert-light border mt-4 mb-0 text-center small">
                            <strong>Demo Credentials:</strong><br>
                            Patient: <code>johndoe</code> / <code>Patient@123</code><br>
                            Doctor: <code>drsarah</code> / <code>Doctor@123</code><br>
                            Admin: <code>admin</code> / <code>Admin@123</code>
                        </div>
                    </div>
                    <div class="card-footer bg-light p-3 text-center border-0">
                        <span class="text-muted">Don't have a patient account?</span>
                        <a href="/register.html" class="fw-bold text-primary ms-1">Register Now</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
