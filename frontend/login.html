<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CarePulse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="card shadow-lg border-0 rounded-4" style="max-width: 420px; width: 100%;">
        <div class="card-body p-4 p-sm-5">
            <div class="text-center mb-4">
                <a href="/index.html" class="text-decoration-none">
                    <h3 class="fw-bold text-primary"><i class="bi bi-hospital me-2"></i>CarePulse</h3>
                </a>
                <p class="text-muted">Sign in to your account</p>
            </div>

            <form onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Username or Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                        <input type="text" id="loginUsername" class="form-control" placeholder="Enter username or email" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label font-weight-bold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                        <input type="password" id="loginPassword" class="form-control" placeholder="Enter password" required>
                    </div>
                </div>

                <button type="submit" id="btnLogin" class="btn btn-primary w-100 py-2 fw-bold">Sign In</button>
            </form>

            <hr class="my-4">

            <div class="text-center">
                <p class="mb-2 text-muted">Don't have an account? <a href="/register.html" class="text-primary fw-bold text-decoration-none">Register as Patient</a></p>
                <div class="mt-3 p-3 bg-light rounded text-start small border">
                    <strong class="text-dark d-block mb-1"><i class="bi bi-info-circle me-1"></i> Demo Credentials:</strong>
                    <div><strong>Admin:</strong> admin / Admin@123</div>
                    <div><strong>Doctor:</strong> drsarah / Doctor@123</div>
                    <div><strong>Patient:</strong> johndoe / Patient@123</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
