<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - CarePulse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/index.html">
                <i class="bi bi-hospital text-primary me-2 fs-3"></i> CarePulse
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="/departments.html">Departments</a></li>
                    <li class="nav-item"><a class="nav-link" href="/doctors.html">Doctors</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/contact.html">Contact</a></li>
                </ul>
                <a href="/login.html" class="btn btn-outline-primary me-2">Login</a>
                <a href="/register.html" class="btn btn-primary">Register</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h2 class="fw-bold text-primary mb-4">Contact CarePulse Hospital</h2>
        <div class="row g-4">
            <div class="col-md-6">
                <div class="card p-4 border-0 shadow-sm">
                    <h5 class="fw-bold mb-3">Hospital Information</h5>
                    <p class="mb-2"><i class="bi bi-geo-alt text-primary me-2"></i> 100 Health Sciences Blvd, Medical District</p>
                    <p class="mb-2"><i class="bi bi-telephone text-primary me-2"></i> +1 (800) 555-CARE (2273)</p>
                    <p class="mb-2"><i class="bi bi-envelope text-primary me-2"></i> support@carepulse.hospital</p>
                    <p class="mb-0"><i class="bi bi-clock text-primary me-2"></i> Emergency Services: 24/7 Available</p>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-4 border-0 shadow-sm">
                    <h5 class="fw-bold mb-3">Send Us a Message</h5>
                    <form onsubmit="alert('Message sent successfully!'); return false;">
                        <div class="mb-3"><input type="text" class="form-control" placeholder="Your Name" required></div>
                        <div class="mb-3"><input type="email" class="form-control" placeholder="Your Email" required></div>
                        <div class="mb-3"><textarea class="form-control" rows="3" placeholder="Message" required></textarea></div>
                        <button type="submit" class="btn btn-primary w-100">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
