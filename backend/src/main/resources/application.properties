# Application Server Configuration
server.port=8080
spring.application.name=patient-management-system

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/patient_management}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
app.jwt.secret=9a2f8c3e1b7d5f0e4a6c8b2d1e3f5a7b9c0d2e4f6a8b1c3d5e7f9a0b2c4d6e8f
app.jwt.expiration-ms=86400000

# Springdoc OpenAPI Swagger UI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Serving Frontend Static Resources
spring.web.resources.static-locations=classpath:/static/,file:../frontend/

# Logging Configuration
logging.level.com.patientmanagement=INFO
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.springframework.security=INFO

